name: Publish Core & Module Packages
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required so this job is allowed to publish packages
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full git history — Changesets needs it to diff versions

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every step that touches the registry needs its OWN env: block —
      # steps do NOT inherit env vars from earlier steps.
      - run: pnpm install --frozen-lockfile
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck

      - run: pnpm changeset publish
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}