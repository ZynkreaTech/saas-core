# Tells pnpm which folders are "workspace packages" it should link together
# instead of downloading from the registry during local development.
packages:
  - "packages/*"
  - "modules/modules-system/*"
  - "modules/modules-custom/*"
  - "modules/modules-shared/*"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  esbuild: true
  sharp: false
